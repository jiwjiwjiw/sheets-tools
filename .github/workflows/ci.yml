name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile

      - name: Type-check
        run: yarn typecheck

      - name: Lint
        run: yarn lint
